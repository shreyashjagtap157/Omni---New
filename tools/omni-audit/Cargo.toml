[package]
name = "omni-audit"
version = "0.0.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
omni-registry = { path = "../omni-registry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "3.0", features = ["full", "extra-traits", "visit"] }
walkdir = "2.5"
