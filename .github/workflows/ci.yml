name: Omni CI Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Build & Qualify (Pinned Rust 1.95.0)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_BUILD_CODEGEN_UNITS: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain (pinned contract)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-gnu, riscv64gc-unknown-none-elf
          components: rustfmt, clippy, rust-src, llvm-tools-preview

      - name: Assert pinned toolchain identity
        run: ./ci/assert-toolchain.sh

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Strict Clippy Lints
        run: cargo clippy -j 1 --workspace --all-targets --locked -- -D warnings

      - name: Check Workspace
        run: cargo check -j 1 --workspace --locked

      - name: Execute Workspace Test Suite
        run: cargo test -j 1 --workspace --locked -- --test-threads=1

      - name: Verify Locked Metadata
        run: cargo metadata --format-version 1 --locked > /dev/null

      - name: Verify Specification Manifest Binding
        run: cargo run -j 1 -p omni-conform --locked

      - name: Run Semantic Linkage Reaper
        run: cargo run -j 1 -p omni-audit --locked

      - name: Verify Compiler Crate Topology
        run: cargo run -j 1 -p omni-topology --locked

      - name: Run Foundation 0.0.0.13 Gate
        run: ./ci/gate-0-0-0-13.sh
