name: Omni CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omni-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_BUILD_CODEGEN_UNITS: 1

jobs:
  validate-linux:
    name: Validate (Linux, Rust 1.95.0)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-gnu,riscv64gc-unknown-none-elf
          components: rustfmt,clippy,rust-src,llvm-tools-preview

      - name: Assert pinned toolchain
        run: ./ci/assert-toolchain.sh

      - name: Run complete Linux validation
        run: ./ci/pipeline.sh pr

  validate-macos:
    name: Validate (macOS, Rust 1.95.0)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-gnu,riscv64gc-unknown-none-elf
          components: rustfmt,clippy,rust-src,llvm-tools-preview

      - name: Assert pinned toolchain
        run: ./ci/assert-toolchain.sh

      - name: Run complete macOS validation
        run: ./ci/pipeline.sh pr

  validate-windows:
    name: Validate (Windows, Rust 1.95.0)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,riscv64gc-unknown-none-elf
          components: rustfmt,clippy,rust-src,llvm-tools-preview

      - name: Assert pinned toolchain
        shell: pwsh
        run: ./ci/assert-toolchain.ps1

      - name: Test isolated memory-model research
        shell: pwsh
        run: ./ci/test-memory-models.ps1

      - name: Test strict inventory validator
        shell: pwsh
        run: python ./ci/tests/test_validate_inventory_strict.py

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Check workspace
        shell: pwsh
        run: cargo check -j 1 --workspace --all-targets --locked

      - name: Build workspace
        shell: pwsh
        run: cargo build -j 1 --workspace --locked

      - name: Run strict Clippy
        shell: pwsh
        run: cargo clippy -j 1 --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        shell: pwsh
        run: cargo test -j 1 --workspace --locked -- --test-threads=1

      - name: Verify locked metadata and dependency tree
        shell: pwsh
        run: |
          cargo metadata --format-version 1 --locked | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo tree --locked | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify specification and architecture gates
        shell: pwsh
        run: |
          cargo run -j 1 -p omni-conform --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -j 1 -p omni-audit --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -j 1 -p omni-topology --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test external C API consumers
        shell: pwsh
        run: ./ci/test-c-api.ps1

      - name: Qualify Windows installer payload
        shell: pwsh
        run: ./tools/omni-installer/installer-qualify.ps1 -Configuration Debug -SkipBuild

  gate-readiness:
    name: First-stage gate readiness (informational; does not grant qualification)
    if: always()
    needs: [validate-linux, validate-macos, validate-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report strict inventory and source evidence
        run: python3 ./ci/validate-inventory-strict.py --informational --json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report exact gate blockers
        env:
          LINUX_RESULT: ${{ needs.validate-linux.result }}
          MACOS_RESULT: ${{ needs.validate-macos.result }}
          WINDOWS_RESULT: ${{ needs.validate-windows.result }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path(".")
          blockers = []
          results = {
              "Linux (experimental compatibility)": os.environ["LINUX_RESULT"],
              "macOS (experimental compatibility)": os.environ["MACOS_RESULT"],
              "Windows (required platform)": os.environ["WINDOWS_RESULT"],
          }
          # Windows is the mandatory supported release platform. Linux/macOS
          # results are reported as compatibility evidence and do not block
          # the current Windows-only release scope.
          if results["Windows (required platform)"] != "success":
              blockers.append(
                  "Windows validation result is "
                  f"{results['Windows (required platform)']!r}, not 'success'."
              )

          required_paths = [
              "compiler/omni-std",
              "compiler/omni-runtime-ffi",
              "compiler/omni-runtime/include/omni-rt.h",
              "tools/omni-fmt",
              "compiler/omni-pkg",
              "compiler/omni-build",
              "tools/omni-installer",
              "tools/omni-installer/INSTALLER_QUALIFICATION.md",
              "tools/omni-installer/installer-qualify.ps1",
              "tools/omni-driver/completion.ps1",
              "tools/omni-driver/completion.cmd",
          ]
          for relative in required_paths:
              if not (root / relative).exists():
                  blockers.append(f"Required repository artifact is absent: {relative}")

          inventory_path = root / "IMPLEMENTATION_INVENTORY.md"
          if inventory_path.exists():
              inventory = inventory_path.read_text(encoding="utf-8")

              def summary_row(label, value_pattern=r"(\d+)"):
                  match = re.search(
                      rf"^\|\s*{label}\s*\|\s*{value_pattern}\s*\|\s*(.*?)\s*\|$",
                      inventory,
                      re.M,
                  )
                  return (int(match.group(1)), match.group(2)) if match else (None, None)

              verified, verified_listing = summary_row("Verified")
              partial, _ = summary_row("Partial")
              accepted, _ = summary_row("Accepted")
              blocked, _ = summary_row("Blocked")
              total, _ = summary_row(r"\*\*Total\*\*", r"\*\*(\d+)\*\*")
              if None in (verified, partial, accepted, blocked, total) or verified_listing is None:
                  blockers.append("Inventory summary could not be parsed from its declared table.")
              else:
                  if total != 26:
                      blockers.append(f"Inventory declares {total} mandatory items, expected 26.")
                  if (verified, partial, accepted, blocked) != (26, 0, 0, 0):
                      blockers.append(
                          f"Inventory is {verified} Verified / {partial} Partial / "
                          f"{accepted} Accepted / {blocked} Blocked / {total} Total; "
                          "gate requires 26/0/0/0."
                      )

                  # Expand the summary IDs (including ranges such as COMP-001–017)
                  # and compare them with the detailed Verified table.
                  summary_ids = []
                  for raw_item in verified_listing.split(","):
                      item = raw_item.strip()
                      range_match = re.fullmatch(r"([A-Z]+)-(\d{3})[–-](\d{3})", item)
                      single_match = re.fullmatch(r"([A-Z]+)-(\d{3})", item)
                      if range_match:
                          prefix, first, last = range_match.groups()
                          summary_ids.extend(
                              f"{prefix}-{number:03d}"
                              for number in range(int(first), int(last) + 1)
                          )
                      elif single_match:
                          prefix, number = single_match.groups()
                          summary_ids.append(f"{prefix}-{int(number):03d}")
                      else:
                          blockers.append(f"Unparseable Verified inventory token: {item!r}")

                  details = re.search(
                      r"## Verified Items \(\d+\)(.*?)(?=^## )",
                      inventory,
                      re.S | re.M,
                  )
                  detailed_ids = (
                      re.findall(
                          r"^\|\s*((?:COMP|INST|PLAT)-\d{3})\s*\|",
                          details.group(1),
                          re.M,
                      )
                      if details else []
                  )
                  if len(summary_ids) != verified:
                      blockers.append(
                          f"Verified summary declares {verified}, but its ID listing expands "
                          f"to {len(summary_ids)} items."
                      )
                  if len(detailed_ids) != verified:
                      blockers.append(
                          f"Verified summary declares {verified}, but the detailed table has "
                          f"{len(detailed_ids)} item rows."
                      )
                  if len(detailed_ids) != len(set(detailed_ids)):
                      blockers.append("Detailed Verified table contains duplicate requirement IDs.")
                  if set(summary_ids) != set(detailed_ids):
                      missing_rows = sorted(set(summary_ids) - set(detailed_ids))
                      unlisted_rows = sorted(set(detailed_ids) - set(summary_ids))
                      blockers.append(
                          "Verified summary IDs and detailed-table IDs disagree: "
                          f"missing detail rows={missing_rows}; "
                          f"unlisted detail rows={unlisted_rows}."
                      )
                  if len(summary_ids) + accepted + blocked != total:
                      blockers.append(
                          "Verified ID listing + Accepted + Blocked does not equal "
                          f"the declared total ({len(summary_ids)} + {accepted} + "
                          f"{blocked} != {total})."
                      )
          else:
              blockers.append("IMPLEMENTATION_INVENTORY.md is absent.")

          # Verify implementation claims directly against source.
          driver_source = root / "compiler/omni-driver/src/main.rs"
          if not driver_source.is_file() or "--run" not in driver_source.read_text(encoding="utf-8"):
              blockers.append("COMP-015 claim is not verified: the driver source lacks a --run option.")

          codegen_dir = root / "compiler/omni-codegen/src"
          codegen_sources = list(codegen_dir.rglob("*.rs")) if codegen_dir.is_dir() else []
          if not any("call_indirect" in path.read_text(encoding="utf-8") for path in codegen_sources):
              blockers.append("COMP-011/COMP-017 claim is not verified: no call_indirect emission found in codegen sources.")

          for relative in (
              "compiler/omni-pkg/src/main.rs",
              "compiler/omni-build/src/main.rs",
          ):
              source = root / relative
              if not source.is_file():
                  blockers.append(f"COMP-019 evidence source is absent: {relative}.")
              else:
                  content = source.read_text(encoding="utf-8")
                  if "TODO: Implement" in content or (
                      relative.endswith("omni-pkg/src/main.rs") and "omni-pkg package manager" in content
                  ) or (
                      relative.endswith("omni-build/src/main.rs") and "omni-build build tool" in content
                  ):
                      blockers.append(
                          f"COMP-019 is not substantiated: {relative} remains a placeholder entry point."
                      )

          ffi_dir = root / "compiler/omni-runtime-ffi/src"
          ffi_sources = list(ffi_dir.rglob("*.rs")) if ffi_dir.is_dir() else []
          has_c_abi = any(
              re.search(r'extern\s+"C"', path.read_text(encoding="utf-8"))
              for path in ffi_sources
          )
          if not has_c_abi or not (root / "compiler/omni-runtime/include/omni-rt.h").is_file():
              blockers.append("PLAT-001 claim is not verified: exported C ABI functions and omni-rt.h are not both present.")

          blockers.append(
              "INST-002 still requires a genuinely trusted production Authenticode "
              "publisher identity and successful clean-Windows trust verification."
          )
          blockers.append(
              "ADR-0002 formal qualification still requires a truthful, exact-commit "
              "record backed by passing technical evidence and owner approval."
          )

          summary = [
              "# Omni first-stage gate readiness",
              "",
              "**Result: NOT PASSED unless every mandatory requirement is independently verified.** "
              "This report is informational and does not grant qualification.",
              "",
              "## Required platform validation",
              f"- Windows: {results['Windows (required platform)']}",
              "",
              "## Experimental compatibility (informational only)",
              f"- Linux: {results['Linux (experimental compatibility)']}",
              f"- macOS: {results['macOS (experimental compatibility)']}",
              "",
              "## Outstanding blockers",
          ]
          summary.extend(f"- {item}" for item in blockers)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(summary) + "\n", encoding="utf-8"
          )
          print("\n".join(summary))
          PY
