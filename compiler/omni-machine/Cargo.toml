[package]
name = "omni-machine"
version = "0.0.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
omni-mir = { path = "../omni-mir" }

[dev-dependencies]
# `omni_mir::ir` exposes `Body`/`BlockData` fields typed as `IndexVec`, so tests
# that build MIR by hand need the same type. Reuses the version already locked
# for `omni-mir`.
index_vec = "0.1"
