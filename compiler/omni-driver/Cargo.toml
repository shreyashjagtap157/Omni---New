[package]
name = "omni-driver"
version = "0.0.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
omni-source = { path = "../omni-source" }
omni-lex = { path = "../omni-lex" }
omni-syntax = { path = "../omni-syntax" }
omni-parse = { path = "../omni-parse" }
omni-names = { path = "../omni-names" }
omni-types = { path = "../omni-types" }
omni-own = { path = "../omni-own" }
omni-effects = { path = "../omni-effects" }
omni-hir = { path = "../omni-hir" }
omni-mir = { path = "../omni-mir" }
omni-verify = { path = "../omni-verify" }
omni-machine = { path = "../omni-machine" }
omni-codegen = { path = "../omni-codegen" }
omni-runtime = { path = "../omni-runtime" }

[dependencies.sha2]
version = "0.11"

[dependencies.hex]
version = "0.4"

[dependencies.serde]
version = "1.0"
features = ["derive"]
