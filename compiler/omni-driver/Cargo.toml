[package]
name = "omni-driver"
version = "0.0.0"
edition = "2021"
publish = false

[lints]
workspace = true

# Orchestrator interface: the driver is permitted to invoke frontend,
# semantic, monomorphization, MIR, verification, machine, and native backend
# tiers directly. Lower compiler tiers never depend back on the driver.
# Provenance (0.0.0.12): spec-infrastructure edges only (leaf-ward); the
# evidence schema remains the single format authority.
[dependencies]
omni-parse = { path = "../omni-parse" }
omni-syntax = { path = "../omni-syntax" }
omni-names = { path = "../omni-names" }
omni-types = { path = "../omni-types" }
omni-traits = { path = "../omni-traits" }
omni-effects = { path = "../omni-effects" }
omni-mir = { path = "../omni-mir" }
omni-verify = { path = "../omni-verify" }
omni-machine = { path = "../omni-machine" }
omni-codegen = { path = "../omni-codegen" }
omni-evidence = { path = "../../tools/omni-evidence" }
omni-registry = { path = "../../tools/omni-registry" }
omni-stage0 = { path = "../omni-stage0" }

[dev-dependencies]
omni-canon = { path = "../../tools/omni-canon" }
serde_json = "1.0"
